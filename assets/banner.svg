<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="t d">
  <title id="t">Vamsi Krishna Sadu</title>
  <desc id="d">AI engineer who builds LLM systems that show their work and publish their misses</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#101a3a"/>
      <stop offset="1" stop-color="#1b2a63"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <style>
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
      .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
      .l{opacity:0;animation:in .5s ease forwards}
      .l1{animation-delay:.4s}.l2{animation-delay:1.1s}.l3{animation-delay:1.8s}
      .l4{animation-delay:2.5s}.l5{animation-delay:3.2s}.l6{animation-delay:3.9s}
      @keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
      .cur{animation:blink 1s steps(1) infinite}
      @keyframes blink{50%{opacity:0}}
      .pulse{animation:pulse 3s ease-in-out infinite}
      @keyframes pulse{50%{opacity:.35}}
    </style>
  </defs>
  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="18" fill="url(#grid)"/>
  <circle class="pulse" cx="120" cy="40" r="140" fill="#38bdf8" opacity="0.08"/>

  <!-- left: name and line -->
  <text x="56" y="112" class="sans" font-size="54" font-weight="800" fill="url(#ink)">Vamsi Krishna Sadu</text>
  <text x="58" y="156" class="sans" font-size="24" fill="#e2e8f0">AI engineer. I build LLM systems that</text>
  <text x="58" y="188" class="sans" font-size="24" fill="#e2e8f0">show their work and publish their misses.</text>
  <g class="mono" font-size="15" fill="#94a3b8">
    <text x="58" y="240">LLM evaluation  ·  retrieval  ·  agents  ·  backend systems</text>
    <text x="58" y="266">Denton / Plano, TX  ·  MS in Computer Science, UNT</text>
  </g>

  <!-- right: terminal -->
  <g transform="translate(655,36)">
    <rect width="500" height="248" rx="12" fill="#070b16" stroke="#334155" stroke-width="1.2"/>
    <rect width="500" height="34" rx="12" fill="#0f172a"/>
    <rect y="22" width="500" height="12" fill="#0f172a"/>
    <circle cx="20" cy="17" r="5.5" fill="#f87171"/><circle cx="40" cy="17" r="5.5" fill="#fbbf24"/><circle cx="60" cy="17" r="5.5" fill="#4ade80"/>
    <text x="250" y="22" text-anchor="middle" class="mono" font-size="12" fill="#64748b">deal-notes-graph  ·  note n01</text>
    <g class="mono" font-size="14">
      <g class="l l1"><text x="22" y="68" fill="#64748b">$</text><text x="40" y="68" fill="#e2e8f0">extract --note n01</text></g>
      <g class="l l2"><text x="22" y="100" fill="#7dd3fc">company</text><text x="130" y="100" fill="#f8fafc">Harbor Lane Logistics</text><text x="440" y="100" fill="#4ade80">quoted</text></g>
      <g class="l l3"><text x="22" y="126" fill="#7dd3fc">contact</text><text x="130" y="126" fill="#f8fafc">Imani Dorsey</text><text x="440" y="126" fill="#4ade80">quoted</text></g>
      <g class="l l4"><text x="22" y="152" fill="#7dd3fc">stage</text><text x="130" y="152" fill="#f8fafc">discovery</text><text x="440" y="152" fill="#4ade80">quoted</text></g>
      <g class="l l5"><text x="22" y="190" fill="#64748b"># scored on 30 notes, 143 facts</text></g>
      <g class="l l5"><text x="22" y="214" fill="#fbbf24" xml:space="preserve">precision 0.993   recall 0.986   3 misses published</text></g>
      <g class="l l6"><text x="22" y="238" fill="#64748b">$</text><rect class="cur" x="40" y="226" width="9" height="15" fill="#e2e8f0"/></g>
    </g>
  </g>
</svg>
